<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Подсказка</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: Arial, sans-serif;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
    }

    .container {
        text-align: center;
        background: rgba(255,255,255,0.9);
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    .photo-frame {
        width: 500px;
        height: 600px;
        border: 3px dashed #666;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        background: #f0f0f0;
        color: #666;
        font-size: 16px;
    }

    h2 {
        margin: 0;
    }
</style>
</head>
<body>

<div class="container">
    <div class="photo-frame">
        <img src="PH.jpg" style="width: 100%; height: 100%;">
    </div>
    <h2>Добро пожаловать!</h2>
    <p>Пароль введён верно.</p>
</div>

</body>
</html>
